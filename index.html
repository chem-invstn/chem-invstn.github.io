<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHEM•INV — Santan Laboratory</title>
  <!-- Font: Plus Jakarta Sans (antarmuka & judul), JetBrains Mono (kode/ID) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Ikon SVG (font) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script>
    // Terapkan tema sebelum render pertama (hindari kedip)
    (function () { try { var t = localStorage.getItem('ci_theme'); if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();
  </script>
  <script>
    // Diagnostik muat awal: menampilkan penyebab bila aplikasi tidak bisa berjalan
    window.__ciStage = 'html';
    (function () {
      function escH(t) { return String(t).replace(/[<&>]/g, function (c) { return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; }); }
      function box(html) { var el = document.getElementById('bootMsg'); if (el) el.innerHTML = html; }
      window.__ciBootErr = function (m) { box('<span style="color:#B42318">' + escH(m) + '</span>'); };
      window.addEventListener('error', function (e) {
        if (window.__ciStage === 'ready' || !e || !e.message) return;
        if (e.filename && !/\/js\/(app|config)\.js/.test(e.filename)) return;   // abaikan galat skrip pihak ketiga
        box('<span style="color:#B42318"><b>Galat skrip:</b> ' + escH(e.message) + (e.lineno ? ' (' + escH(String(e.filename).split('/').pop()) + ' baris ' + e.lineno + ')' : '') + '</span>');
      });
      setTimeout(function () {
        var s = window.__ciStage; if (s === 'ready' || s === 'rpc-gagal' || s === 'setup') return;
        var el = document.getElementById('bootMsg'); if (el && /Galat skrip/.test(el.textContent)) return;
        var hint = {
          html: 'File <b>js/app.js</b> tidak termuat. Pastikan folder <b>js/</b> dan <b>css/</b> ada di repository GitHub (bukan file rata di root), lalu muat ulang dengan Ctrl+Shift+R.',
          js: 'Skrip termuat tetapi inisialisasi tidak dipanggil.',
          init: 'Inisialisasi terhenti (lihat Console browser, F12).',
          rpc: 'Server belum merespons. Periksa: (1) URL /exec di js/config.js benar, (2) deployment Apps Script versi terbaru dengan akses <b>Siapa saja</b>, (3) setupAppEnvironment sudah dijalankan.'
        }[s] || s;
        box('<span style="color:#B42318">Tahap tertahan: <b>' + s + '</b></span><br>' + hint + (window.boot ? '<br><button class="btn btn-sm mt8" onclick="boot()">Coba lagi</button>' : ''));
      }, 20000);
    })();
  </script>
  <meta name="description" content="CHEM•INV — sistem inventaris bahan kimia Santan Laboratory">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/logo-32.png">
  <link rel="apple-touch-icon" href="img/logo-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=3.0.0">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="ciBulb"><circle cx="46" cy="84" r="28"/></clipPath><clipPath id="ciCone"><path d="M76 46 L76 58 L103 102 L59 102 L67 58 L67 46 Z"/></clipPath></defs><symbol id="ciLogo" viewBox="4 4 120 120"><g style="stroke:var(--logo-ink,#1B2433)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="58" y="104" width="58" height="12" rx="6" fill="#fff"/><rect x="62" y="92" width="52" height="12" rx="6" fill="#fff"/><path d="M69 36 L69 56 L54 92 L108 92 L91 56 L91 36" fill="#fff"/><rect x="64" y="28" width="32" height="10" rx="5" fill="#fff"/></g><path d="M60 78 L102 78 L107.5 90 L55 90 Z" fill="#0072BC"/><path d="M65.5 65 L95 65 L101 78 L60 78 Z" fill="#0072BC"/><path d="M73 44 L73 56" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M69 36 L69 56 L54 92 L108 92 L91 56 L91 36" fill="none" style="stroke:var(--logo-ink,#1B2433)" stroke-width="5" stroke-linejoin="round"/><path d="M70 98 L106 98" stroke="#8DC63F" stroke-width="5" stroke-linecap="round"/><path d="M66 110 L108 110" stroke="#ED1C24" stroke-width="5" stroke-linecap="round"/><g style="stroke:var(--logo-ink,#1B2433)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M37 44 L37 58 A30 30 0 1 0 55 58 L55 44 Z" fill="#fff"/></g><path d="M14 82 Q25 72 37 80 Q50 89 78 74 L78 118 L14 118 Z" fill="#ED1C24" clip-path="url(#ciBulb)"/><path d="M28 88 A20 20 0 0 1 33 74" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="40" cy="96" r="5" fill="#fff"/><circle cx="50" cy="102" r="2.8" fill="#fff"/><path d="M37 44 L37 58 A30 30 0 1 0 55 58 L55 44" fill="none" style="stroke:var(--logo-ink,#1B2433)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="31" y="36" width="30" height="10" rx="5" fill="#fff" style="stroke:var(--logo-ink,#1B2433)" stroke-width="5"/><circle cx="30" cy="16" r="6" fill="#ED1C24"/><circle cx="34" cy="29" r="3.8" fill="#ED1C24"/><circle cx="51" cy="21" r="6.5" fill="#8DC63F" style="stroke:var(--logo-ink,#1B2433)" stroke-width="4"/><circle cx="49" cy="18.5" r="1.8" fill="#fff"/><circle cx="86" cy="11" r="4.5" fill="#0072BC"/><circle cx="78" cy="19" r="2.8" fill="#0072BC"/><circle cx="96" cy="20" r="3" fill="#8DC63F"/></symbol></svg>

  <!-- ═══ Layar muat awal ═══ -->
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-box">
      <div class="row"><span class="logo" aria-hidden="true"><svg viewBox="4 4 120 120"><use href="#ciLogo"/></svg></span><div class="brand-txt"><span class="brand-name">CHEM•INV</span><span class="brand-sub">Santan Laboratory</span></div></div>
      <div class="boot-bar"></div>
      <div id="bootMsg" class="lbl mt8">Menyiapkan aplikasi…</div>
    </div>
  </div>

  <!-- ═══ Masuk (nama pengguna + password) ═══ -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <div class="panel-b" style="padding:28px 24px">
        <div class="row mb8"><span class="logo" aria-hidden="true"><svg viewBox="4 4 120 120"><use href="#ciLogo"/></svg></span><div class="brand-txt"><span class="brand-name">CHEM•INV</span><span class="brand-sub">Santan Laboratory</span></div></div>
        <form id="fLogin" class="mt16" autocomplete="on">
          <h2 class="h-md" style="margin:0 0 12px">Masuk</h2>
          <div class="field"><label for="liUser">Nama pengguna</label><input id="liUser" class="inp" type="text" required autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="mis. Budi Santoso"></div>
          <div class="field mt12"><label for="liPass">Password</label><div class="ingrp"><input id="liPass" class="inp" type="password" required autocomplete="current-password"><button class="suf" type="button" data-act="togglePass" data-for="liPass" title="Tampilkan password" style="cursor:pointer"><i class="bi bi-eye"></i></button></div></div>
          <div id="loginErr" class="ferr mt8"></div>
          <button class="btn btn-p btn-lg btn-blk mt12" type="submit" id="btnLogin"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>
          <p class="help mt12">Lupa password? Hubungi Admin untuk mengatur ulang.</p>
        </form>
        <form id="fPass" class="mt16 hidden" autocomplete="off">
          <h2 class="h-md" style="margin:0 0 4px">Buat password baru</h2>
          <p class="help" style="margin:0 0 12px">Ini masuk pertama Anda (atau password baru diatur Admin). Buat password pribadi, minimal 6 karakter.</p>
          <div class="field"><label for="liNew1">Password baru</label><input id="liNew1" class="inp" type="password" required minlength="6" autocomplete="new-password"></div>
          <div class="field mt12"><label for="liNew2">Ulangi password baru</label><input id="liNew2" class="inp" type="password" required minlength="6" autocomplete="new-password"></div>
          <div id="passErr" class="ferr mt8"></div>
          <button class="btn btn-p btn-lg btn-blk mt12" type="submit" id="btnPass"><i class="bi bi-check2-circle"></i> Simpan &amp; lanjut</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══ Aplikasi (SPA) ═══ -->
  <div id="app" class="app hidden">
    <aside class="side" id="side" aria-label="Menu">
      <div class="side-brand"><span class="logo" aria-hidden="true"><svg viewBox="4 4 120 120"><use href="#ciLogo"/></svg></span><div class="brand-txt side-lbl"><span class="brand-name">CHEM•INV</span><span class="brand-sub">Santan Laboratory</span></div></div>
      <nav class="side-nav" id="sideNav"></nav>
      <button class="side-toggle" data-act="sideToggle" title="Sembunyikan / tampilkan menu"><i class="bi bi-chevron-double-left"></i><span class="side-lbl">Sembunyikan menu</span></button>
    </aside>
    <div class="shell">
    <header class="hdr" role="banner">
      <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="4 4 120 120"><use href="#ciLogo"/></svg></span></div>
      <button class="sync-chip hide-m" id="syncChip" data-act="syncNow" title="Ketuk untuk memperbarui data"><span class="dot"></span><span id="syncTxt">Tersimpan</span></button>
      <div class="hsearch">
        <i class="bi bi-search" aria-hidden="true"></i>
        <label for="gSearch" class="sr">Cari bahan, CAS, atau ID wadah</label>
        <input id="gSearch" type="search" placeholder="Cari bahan atau botol…" autocomplete="off" data-in="gsearch">
        <span class="kbd hide-m">Ctrl+K</span>
        <div id="gDrop" class="sdrop hidden" role="listbox"></div>
      </div>
      <button class="hbtn bell" data-act="notifPanel" title="Peringatan"><i class="bi bi-bell"></i><span class="cnt hidden" id="bellCnt">0</span></button>
      <div style="position:relative;display:flex">
        <button class="user-box" data-act="userMenu" aria-haspopup="true">
          <span class="avatar" id="uAvatar">--</span>
          <span class="hide-m" style="text-align:left"><b id="uName" style="font-family:var(--f-head)">—</b><br><span class="t-sm muted" id="uRole">—</span></span>
        </button>
        <div id="userMenu" class="menu hidden"></div>
      </div>
    </header>

    <div class="body">
      <main class="main" id="main">
        <section id="v-dashboard" class="view" aria-label="Beranda"></section>
        <section id="v-terima" class="view" aria-label="Penerimaan"></section>
        <section id="v-ambil" class="view" aria-label="Pengambilan FEFO"></section>
        <section id="v-stok" class="view" aria-label="Cari & daftar stok"></section>
        <section id="v-po" class="view" aria-label="Pesanan PO"></section>
        <section id="v-opname" class="view" aria-label="Stok opname"></section>
        <section id="v-sds" class="view" aria-label="Registri SDS & K3"></section>
        <section id="v-master" class="view" aria-label="Master data"></section>
        <section id="v-audit" class="view" aria-label="Audit trail & laporan"></section>
        <section id="v-pengaturan" class="view" aria-label="Pengaturan"></section>
        <section id="v-lainnya" class="view" aria-label="Menu lainnya"></section>
      </main>
    </div>
    </div>

    

    <nav class="mbar" aria-label="Menu utama">
      <button data-act="go" data-v="dashboard"><i class="bi bi-house-door"></i>Beranda</button>
      <button data-act="go" data-v="terima"><i class="bi bi-box-arrow-in-down"></i>Terima Barang</button>
      <button class="pri" data-act="go" data-v="ambil"><i class="bi bi-eyedropper"></i>Ambil Barang</button>
      <button data-act="go" data-v="stok"><i class="bi bi-boxes"></i>Stok Barang</button>
      <button data-act="go" data-v="lainnya"><i class="bi bi-grid"></i>Lainnya</button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <!-- Pustaka (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script src="js/config.js?v=3.0.0"></script>
  <script src="js/app.js?v=3.0.0"></script>
</body>
</html>
